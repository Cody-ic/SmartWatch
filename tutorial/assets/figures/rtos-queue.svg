<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" role="img" aria-labelledby="title desc"><title id="title">通知之外，还需要保存具体的数据</title><desc id="desc">本例队列按值复制整数，发送方之后修改局部变量，不会改变已经排队的副本。</desc><rect width="900" height="425" rx="14" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif" fill="#18383e"><text x="35" y="43" font-size="24" font-weight="700">通知之外，还需要保存具体的数据</text><rect x="35" y="68" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="98" font-size="21" font-weight="700">产生数据的任务</text><text x="58" y="127" font-size="18">发送数值 10，然后继续产生 20、30</text><path d="M450 148v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="173" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="203" font-size="21" font-weight="700">内核管理的队列</text><text x="58" y="232" font-size="18">按顺序保存待接收的副本，容量有限</text><path d="M450 253v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="278" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="308" font-size="21" font-weight="700">使用数据的任务</text><text x="58" y="337" font-size="18">取出 10，再取 20；队列为空时可以阻塞</text></g></svg>