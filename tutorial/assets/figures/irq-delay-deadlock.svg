<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290"><rect width="900" height="290" fill="#fffefb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64877d"/></marker></defs><rect x="30" y="45" width="250" height="100" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="45" y="78" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">当前 ISR 等延时结束</text><text x="45" y="107" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">需要 HAL 时间计数增加</text><path d="M285 95 L345 95" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="45" width="230" height="100" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="365" y="78" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">时基中断等待执行</text><text x="365" y="107" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">抢占等级不够，不能进入</text><path d="M585 95 L645 95" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="650" y="45" width="220" height="100" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="665" y="78" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">当前 ISR 仍未退出</text><text x="665" y="107" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">时基继续等待</text><path d="M760 150 V200 H150 V150" fill="none" stroke="#c47912" stroke-width="3" marker-end="url(#a)"/><text x="80" y="255" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#183d37">硬件可能仍在计时，但增加软件时间计数的代码没有得到执行机会。</text></svg>