<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 407" role="img" aria-labelledby="title desc"><title id="title">点击、修改状态与重新构建</title><desc id="desc">setState 的回调是同步的数据修改，不把异步等待放在这个回调里。</desc><rect width="900" height="407" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">点击、修改状态与重新构建</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">用户点击按钮</text><text x="52" y="124" font-size="19">框架执行 onPressed 回调</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">setState 修改 State 中的数据</text><text x="52" y="228" font-size="19">本例电压减去 10，并标记界面需要更新</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">框架再次调用 build</text><text x="52" y="332" font-size="19">读取新状态，更新相关可见内容</text></g></svg>