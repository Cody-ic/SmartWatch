<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">启动顺序先解决“谁先准备好”</title><desc id="desc">这是一条依赖顺序；初始化期间已启动的硬件也可能产生中断，不能只凭任务尚未运行就忽略回调。</desc><rect width="900" height="530" rx="14" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif" fill="#18383e"><text x="35" y="43" font-size="24" font-weight="700">启动顺序先解决“谁先准备好”</text><rect x="35" y="68" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="98" font-size="21" font-weight="700">外设配置与同步对象</text><text x="58" y="127" font-size="18">驱动需要可用的外设；中断使用的对象必须有效</text><path d="M450 148v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="173" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="203" font-size="21" font-weight="700">驱动与应用初始化</text><text x="58" y="232" font-size="18">电池配置早于麦克风启动；显示和协议处理先就绪</text><path d="M450 253v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="278" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="308" font-size="21" font-weight="700">创建三个任务并检查结果</text><text x="58" y="337" font-size="18">此时保存每个入口、栈空间和优先级</text><path d="M450 358v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="383" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="413" font-size="21" font-weight="700">启动调度器</text><text x="58" y="442" font-size="18">之后应用循环分别在各任务中推进</text></g></svg>