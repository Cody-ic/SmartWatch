<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">同一采样来源，各自保存待处理帧</title><desc id="desc">两份帧把两个使用者的读取进度分开；事件组仍只负责唤醒提示。</desc><rect width="900" height="530" rx="14" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif" fill="#18383e"><text x="35" y="43" font-size="24" font-weight="700">同一采样来源，各自保存待处理帧</text><rect x="35" y="68" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="98" font-size="21" font-weight="700">DMA 循环写入采集数组 mic_buf</text><text x="58" y="127" font-size="18">前半、后半完成时，中断回调取得已经完成的半区</text><path d="M450 148v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="173" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="203" font-size="21" font-weight="700">驱动复制到各自可写的帧</text><text x="58" y="232" font-size="18">ch_mic 供声音检测；ch_kws 供关键词识别</text><path d="M450 253v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="278" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="308" font-size="21" font-weight="700">帧完整后通知相应处理工作</text><text x="58" y="337" font-size="18">每项任务先确认自己的帧状态，再读取自己的数据</text><path d="M450 358v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="383" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="413" font-size="21" font-weight="700">处理完成，归还本通道空间</text><text x="58" y="442" font-size="18">驱动再允许更新该帧；一个通道不会清掉另一个通道的状态</text></g></svg>