<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" role="img" aria-labelledby="title desc"><title id="title">从硬件事件到任务继续执行</title><desc id="desc">信号量负责通知；传感器先进先出缓冲区负责保存样本。</desc><rect width="900" height="425" rx="14" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif" fill="#18383e"><text x="35" y="43" font-size="24" font-weight="700">从硬件事件到任务继续执行</text><rect x="35" y="68" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="98" font-size="21" font-weight="700">传感器继续采样，任务阻塞等待</text><text x="58" y="127" font-size="18">数据还没到时，处理器可以执行声音等其他任务</text><path d="M450 148v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="173" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="203" font-size="21" font-weight="700">水印中断发生</text><text x="58" y="232" font-size="18">中断回调释放二值信号量，告诉任务有工作要处理</text><path d="M450 253v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="278" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="308" font-size="21" font-weight="700">任务变成就绪，再由调度器选择</text><text x="58" y="337" font-size="18">等待接口返回，任务读取两颗器件中实际积累的数据</text></g></svg>