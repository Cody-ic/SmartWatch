<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" role="img" aria-labelledby="title"><title id="title">现有 GC9A01 初始化从复位到显示开启的阶段</title><rect width="700" height="510" fill="#fffefb"/><rect x="25" y="20" width="650" height="67" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="47" font-size="20" font-weight="bold">RST 低 50 ms，高后等待 120 ms</text><text x="350" y="71" font-size="17">先让控制器进入已知起点</text></g><path d="M350 91 v16 m-5 -5 l5 5 5 -5" stroke="#64877d" stroke-width="2" fill="none"/><rect x="25" y="113" width="650" height="67" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="140" font-size="20" font-weight="bold">发送控制器配置</text><text x="350" y="164" font-size="17">内部时序、电源与面板相关设置</text></g><path d="M350 184 v16 m-5 -5 l5 5 5 -5" stroke="#64877d" stroke-width="2" fill="none"/><rect x="25" y="206" width="650" height="67" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="233" font-size="20" font-weight="bold">设置方向、像素格式、地址范围</text><text x="350" y="257" font-size="17">决定坐标怎样映射、颜色怎样解释</text></g><path d="M350 277 v16 m-5 -5 l5 5 5 -5" stroke="#64877d" stroke-width="2" fill="none"/><rect x="25" y="299" width="650" height="67" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="326" font-size="20" font-weight="bold">Sleep Out：0x11，等待 120 ms</text><text x="350" y="350" font-size="17">退出休眠，等待面板准备</text></g><path d="M350 370 v16 m-5 -5 l5 5 5 -5" stroke="#64877d" stroke-width="2" fill="none"/><rect x="25" y="392" width="650" height="67" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="419" font-size="20" font-weight="bold">Display On：0x29，等待 20 ms</text><text x="350" y="443" font-size="17">允许显示；图像内容仍需写入</text></g></svg>