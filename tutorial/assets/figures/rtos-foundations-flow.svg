<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" role="img" aria-labelledby="title desc"><title id="title">一个处理器，交替推进两项工作</title><desc id="desc">图中三个阶段先后发生；单核处理器并没有同时执行两个任务。</desc><rect width="900" height="425" rx="14" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif" fill="#18383e"><text x="35" y="43" font-size="24" font-weight="700">一个处理器，交替推进两项工作</text><rect x="35" y="68" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="98" font-size="21" font-weight="700">传感器任务执行</text><text x="58" y="127" font-size="18">读完已有数据，随后等待下一次传感器事件</text><path d="M450 148v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="173" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="203" font-size="21" font-weight="700">处理器转去执行声音任务</text><text x="58" y="232" font-size="18">处理已经采集好的声音；这时传感器任务没有执行</text><path d="M450 253v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="278" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="308" font-size="21" font-weight="700">传感器任务再次得到执行机会</text><text x="58" y="337" font-size="18">从等待之后继续，局部进度能够保留下来</text></g></svg>