<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" role="img" aria-labelledby="title desc"><title id="title">进度对应可确认的设备状态</title><desc id="desc">界面上的百分比不能代替内容校验、启动成功或最终确认。</desc><rect width="900" height="511" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">进度对应可确认的设备状态</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">选择文件与检查清单</text><text x="52" y="124" font-size="19">确认目标、版本、大小和来源</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">发送并等待设备确认</text><text x="52" y="228" font-size="19">分片、串行写入、超时重试与断连提示</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">设备检查完整内容</text><text x="52" y="332" font-size="19">传完不等于可以采用；等待整包检查结果</text><path d="M450 353v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="377" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="407" font-size="22" font-weight="700">试运行与最终状态查询</text><text x="52" y="436" font-size="19">重连后确认实际版本和健康状态</text></g></svg>