<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" role="img" aria-labelledby="title desc"><title id="title">任务切换保存执行进度</title><desc id="desc">任务栈彼此独立；文件级变量和同一个外设仍然可能共享。</desc><rect width="900" height="425" rx="14" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif" fill="#18383e"><text x="35" y="43" font-size="24" font-weight="700">任务切换保存执行进度</text><rect x="35" y="68" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="98" font-size="21" font-weight="700">任务 A：计算到一半</text><text x="58" y="127" font-size="18">保存需要恢复的处理器状态；A 的栈仍保留着</text><path d="M450 148v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="173" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="203" font-size="21" font-weight="700">任务 B：恢复并继续</text><text x="58" y="232" font-size="18">装入 B 的状态，使用 B 的任务栈</text><path d="M450 253v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="278" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="308" font-size="21" font-weight="700">再回到任务 A</text><text x="58" y="337" font-size="18">恢复 A 的状态，继续刚才的函数调用</text></g></svg>