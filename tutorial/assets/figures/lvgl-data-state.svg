<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 421" role="img" aria-label="样本与页面状态需要共同更新"><rect width="700" height="421" fill="#fffefb"/><rect x="25" y="20" width="650" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="48" font-size="20" font-weight="bold">暂无有效数据</text><text x="350" y="72" font-size="17">显示占位，不冒充正常数值</text></g><path d="M350 91 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="114" width="650" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="142" font-size="20" font-weight="bold">收到新鲜样本</text><text x="350" y="166" font-size="17">保存数值、有效性和测量时间</text></g><path d="M350 185 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="208" width="650" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="236" font-size="20" font-weight="bold">没有新数据，时间仍在前进</text><text x="350" y="260" font-size="17">UI 周期检查样本年龄</text></g><path d="M350 279 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="302" width="650" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="330" font-size="20" font-weight="bold">样本过期或失效</text><text x="350" y="354" font-size="17">更新数值与状态，不继续显示旧的正常外观</text></g></svg>