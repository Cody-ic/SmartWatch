<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 417" role="img" aria-labelledby="title"><title id="title">一个命令字节经过 GPIO 控制与 SPI 硬件到达屏幕</title><rect width="700" height="417" fill="#fffefb"/><rect x="25" y="20" width="650" height="67" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="47" font-size="20" font-weight="bold">应用要设置显示区域</text><text x="350" y="71" font-size="17">调用公开函数，进入 gc9a01.c 内部</text></g><path d="M350 91 v16 m-5 -5 l5 5 5 -5" stroke="#64877d" stroke-width="2" fill="none"/><rect x="25" y="113" width="650" height="67" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="140" font-size="20" font-weight="bold">驱动控制 CS 与 D/C</text><text x="350" y="164" font-size="17">选中屏幕，区分命令或参数</text></g><path d="M350 184 v16 m-5 -5 l5 5 5 -5" stroke="#64877d" stroke-width="2" fill="none"/><rect x="25" y="206" width="650" height="67" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="233" font-size="20" font-weight="bold">spi_write → HAL_SPI_Transmit</text><text x="350" y="257" font-size="17">从内存取字节，交给 SPI2</text></g><path d="M350 277 v16 m-5 -5 l5 5 5 -5" stroke="#64877d" stroke-width="2" fill="none"/><rect x="25" y="299" width="650" height="67" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="326" font-size="20" font-weight="bold">PB13 / PB15 输出时钟和位</text><text x="350" y="350" font-size="17">屏幕按接口约定采样并解释</text></g></svg>