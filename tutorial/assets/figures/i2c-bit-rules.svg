<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-label="先分清普通数据与事务边界"><rect width="960" height="350" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif"><text x="28" y="37" font-size="23" fill="#182a30" text-anchor="start">先分清普通数据与事务边界</text><rect x="35" y="70" width="270" height="205" rx="8" fill="#edf2f6" stroke="#a5bdb5"/><text x="170" y="104" font-size="21" fill="#182a30" text-anchor="middle">普通数据位</text><text x="47" y="147" font-size="15" fill="#182a30" text-anchor="start">SCL</text><text x="47" y="217" font-size="15" fill="#182a30" text-anchor="start">SDA</text><path d="M100 165 H150 V125 H245 V165 H285 M100 235 H125 V195 H275 V235 H285" stroke="#007b68" stroke-width="3" fill="none"/><text x="170" y="258" font-size="15" fill="#182a30" text-anchor="middle">高期间保持；低期间准备</text><rect x="350" y="70" width="270" height="205" rx="8" fill="#edf2f6" stroke="#a5bdb5"/><text x="485" y="104" font-size="21" fill="#182a30" text-anchor="middle">START</text><text x="362" y="147" font-size="15" fill="#182a30" text-anchor="start">SCL</text><text x="362" y="217" font-size="15" fill="#182a30" text-anchor="start">SDA</text><path d="M415 125 L595 125" fill="none" stroke="#779b8f" stroke-width="3"/><path d="M415 195 H495 V235 H595" stroke="#d18226" stroke-width="3" fill="none"/><text x="485" y="258" font-size="15" fill="#182a30" text-anchor="middle">SCL 高时 SDA 下降</text><rect x="665" y="70" width="270" height="205" rx="8" fill="#edf2f6" stroke="#a5bdb5"/><text x="800" y="104" font-size="21" fill="#182a30" text-anchor="middle">STOP</text><text x="677" y="147" font-size="15" fill="#182a30" text-anchor="start">SCL</text><text x="677" y="217" font-size="15" fill="#182a30" text-anchor="start">SDA</text><path d="M730 125 L910 125" fill="none" stroke="#779b8f" stroke-width="3"/><path d="M730 235 H810 V195 H910" stroke="#d18226" stroke-width="3" fill="none"/><text x="800" y="258" font-size="15" fill="#182a30" text-anchor="middle">SCL 高时 SDA 上升</text><text x="35" y="323" font-size="19" fill="#182a30" text-anchor="start">只有 START / STOP 用这种高电平期间的 SDA 跳变标记边界。</text></g></svg>