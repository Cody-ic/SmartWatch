<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 407" role="img" aria-labelledby="title desc"><title id="title">先分清程序运行在哪里</title><desc id="desc">图中的相邻设备双向通信；箭头仅用于展示阅读顺序。</desc><rect width="900" height="407" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">先分清程序运行在哪里</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">手机 App</text><text x="52" y="124" font-size="19">显示数据、发送设置；使用手机提供的蓝牙接口</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">CH582M</text><text x="52" y="228" font-size="19">运行蓝牙服务；把收到的字节转给串口</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">STM32U575</text><text x="52" y="332" font-size="19">采集、计算和显示；解释应用消息并作出响应</text></g></svg>