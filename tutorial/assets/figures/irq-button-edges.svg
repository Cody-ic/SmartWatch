<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300"><rect width="900" height="300" fill="#fffefb"/><path d="M70 75 H315 V165 H610 V75 H835" fill="none" stroke="#007b68" stroke-width="4"/><path d="M315 45 V195 M610 45 V195" stroke="#d58a22" stroke-width="2" stroke-dasharray="4 4"/><text x="80" y="45" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">松开：高</text><text x="365" y="135" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">按住：低</text><text x="670" y="45" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">松开：高</text><text x="245" y="225" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">按下：下降沿</text><text x="550" y="225" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">松开：上升沿</text><text x="85" y="270" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#183d37">持续按住是低电平状态；只选下降沿时，不会因为一直为低而持续产生新边沿。</text></svg>