="#183d37">1C</text><text x="277" y="365" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#183d37">08</text><text x="309" y="365" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#183d37">00</text><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" font-size="18"><text x="365" y="135">例如第 0 列：</text><text x="365" y="177">从上到下：0 0 1 1 1 0 0 0</text><text x="365" y="219">对应 bit 0 → bit 7</text><text x="365" y="261">写成二进制数：00011100</text><text x="365" y="303">所以该字节是 0x1C</text></g></svg>