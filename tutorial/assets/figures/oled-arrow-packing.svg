<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-label="八行像素按竖向八位打包成八个字节，最低位在上"><rect width="760" height="410" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37"><text x="30" y="30" font-size="20">8×8 像素 → 每列一个字节 → 从左到右排列</text><text x="30" y="65" font-size="17">y 向下增加；每列顶端是 bit 0，底端是 bit 7</text></g><rect x="70" y="90" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="102" y="90" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="134" y="90" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="166" y="90" width="30" height="30" fill="#007b68" stroke="#b6c4bd"/><rect x="198" y="90" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="230" y="90" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="262" y="90" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="294" y="90" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="70" y="122" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="102" y="122" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="134" y="122" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="166" y="122" width="30" height="30" fill="#007b68" stroke="#b6c4bd"/><rect x="198" y="122" width="30" height="30" fill="#007b68" stroke="#b6c4bd"/><rect x="230" y="122" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="262" y="122" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="294" y="122" width="30" height="30" fill="#eef2ee" stroke="#b6c4bd"/><rect x="70" y="154" width="30" height="30" fill="#007b68" stroke="#b6c4bd"/><rect x="102" y="154" width="30" height="30" fill="#007b68" stroke="#b6c4bd"/><rect x="134" y="154" width="30" height="30" fill="#007b68" stroke="#b6c4bd"/><rect x="166" y="154" width="30" height="30" fill="#007b68" stroke="#b6c4bd"/><rect x="198" y="154" width="30" height="30" fill="#007b68" stroke="#b6c4bd"/><rect x="230" y="1