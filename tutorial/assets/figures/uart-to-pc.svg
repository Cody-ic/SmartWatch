<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260"><rect width="900" height="260" fill="#fffefb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64877d"/></marker></defs><rect x="20" y="45" width="230" height="100" rx="12" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="38" y="80" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">STM32 USART1</text><text x="38" y="109" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">PA9 发出高低电平</text><path d="M255 95 L310 95" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="315" y="45" width="255" height="100" rx="12" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="333" y="80" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">USB 转串口模块</text><text x="333" y="109" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">RX 收电平，转换为 USB 数据</text><path d="M575 95 L630 95" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="635" y="45" width="245" height="100" rx="12" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="653" y="80" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">电脑串口工具</text><text x="653" y="109" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">把收到的字节显示出来</text><text x="65" y="205" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">模块没有替单片机决定发送什么；它连接了 UART 接口与电脑的 USB 接口。</text></svg>