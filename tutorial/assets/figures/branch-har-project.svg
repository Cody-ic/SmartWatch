<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" role="img" aria-labelledby="title desc"><title id="title">当前活动识别的执行路径</title><desc id="desc">接口返回失败或特征没有新产生时，不能使用上一轮内容冒充新结果。</desc><rect width="900" height="511" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">当前活动识别的执行路径</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">Sensor_Task → app_on_imu_batch</text><text x="52" y="124" font-size="19">取得一批有效数据，再交给活动识别</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">HAR_AddSamples</text><text x="52" y="228" font-size="19">环形数组积累窗口，生成线性排列并预处理</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">har_model_run</text><text x="52" y="332" font-size="19">填网络输入，执行推理，读取七类分数</text><path d="M450 353v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="377" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="407" font-size="22" font-weight="700">应用与原型处理</text><text x="52" y="436" font-size="19">更新活动结果，取得新特征后执行原型分类与会话筛选</text></g></svg>