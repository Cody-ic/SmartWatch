<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 355"><rect width="900" height="355" fill="#fffefb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64877d"/></marker></defs><g stroke="#a8bfb6" fill="#e6f2eb"><rect x="35" y="55" width="450" height="45"/><rect x="35" y="100" width="450" height="45"/><rect x="35" y="145" width="450" height="45"/><rect x="35" y="190" width="450" height="45"/><rect x="35" y="235" width="450" height="45"/></g><text x="55" y="40" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">向量表：保存初始值和处理入口地址</text><text x="55" y="85" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#183d37">第 0 项：初始栈指针值</text><text x="55" y="130" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#183d37">第 1 项：Reset_Handler 的入口</text><text x="55" y="175" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#183d37">…… 内核异常 ……</text><text x="55" y="220" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#183d37">第 77 项：USART1_IRQHandler 的入口</text><text x="55" y="265" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#183d37">…… 其他外设中断 ……</text><path d="M490 212 L555 212" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="565" y="170" width="300" height="95" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="580" y="203" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">USART1_IRQHandler</text><text x="580" y="232" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">再调用 HAL_UART_IRQHandler</text><text x="85" y="325" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">向量表指向中断入口，不直接指向 HAL_UART_RxCpltCallback。</text></svg>