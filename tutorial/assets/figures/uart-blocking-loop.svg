<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260"><rect width="900" height="260" fill="#fffefb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64877d"/></marker></defs><rect x="25" y="50" width="225" height="100" rx="12" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="43" y="85" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">主循环先读串口</text><text x="43" y="114" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">等到 1 字节，或等到超时</text><path d="M255 100 L330 100" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="335" y="50" width="220" height="100" rx="12" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="353" y="85" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">函数返回后</text><text x="353" y="114" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">执行本轮其他工作</text><path d="M560 100 L635 100" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="640" y="50" width="230" height="100" rx="12" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="658" y="85" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">再进入下一轮</text><text x="658" y="114" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">再次等待接收</text><text x="65" y="225" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">把超时从 10 ms 改成 1000 ms，无数据时，后面的工作也可能多等很久。</text></svg>