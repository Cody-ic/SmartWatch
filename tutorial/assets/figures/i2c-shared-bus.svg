<svg xmlns="http://www.w3.org/2000/svg" width="960" height="365" viewBox="0 0 960 365" role="img" aria-label="多个器件共用两根通信线，先用地址选中其中一个"><rect width="960" height="365" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif"><text x="28" y="37" font-size="23" fill="#182a30" text-anchor="start">多个器件共用两根通信线，先用地址选中其中一个</text><rect x="35" y="150" width="190" height="120" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="130" y="195" font-size="23" fill="#182a30" text-anchor="middle">主机 MCU</text><text x="130" y="231" font-size="16" fill="#182a30" text-anchor="middle">产生 SCL 时钟</text><rect x="390" y="150" width="225" height="120" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="502" y="195" font-size="23" fill="#182a30" text-anchor="middle">器件 A</text><text x="502" y="231" font-size="18" fill="#182a30" text-anchor="middle">地址 68</text><rect x="695" y="150" width="225" height="120" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="807" y="195" font-size="23" fill="#182a30" text-anchor="middle">器件 B</text><text x="807" y="231" font-size="18" fill="#182a30" text-anchor="middle">不同地址</text><path d="M130 85 L810 85" fill="none" stroke="#779b8f" stroke-width="3"/><path d="M130 120 L810 120" fill="none" stroke="#779b8f" stroke-width="3"/><text x="35" y="90" font-size="18" fill="#182a30" text-anchor="start">SCL</text><text x="35" y="125" font-size="18" fill="#182a30" text-anchor="start">SDA</text><path d="M130 85 L130 150" fill="none" stroke="#779b8f" stroke-width="3"/><path d="M160 120 L160 150" fill="none" stroke="#779b8f" stroke-width="3"/><path d="M500 85 L500 150" fill="none" stroke="#779b8f" stroke-width="3"/><path d="M530 120 L530 150" fill="none" stroke="#779b8f" stroke-width="3"/><path d="M810 85 L810 150" fill="none" stroke="#779b8f" stroke-width="3"/><path d="M840 120 L840 150" fill="none" stroke="#779b8f" stroke-width="3"/><text x="40" y="314" font-size="18" fill="#182a30" text-anchor="start">SDA/SCL 各有上拉；电源、GND 未在本图展开。</text><text x="40" y="342" font-size="17" fill="#182a30" text-anchor="start">同一总线的普通事务逐个选设备；不是同时向两个相同地址器件单独读数。</text></g></svg>