<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" role="img" aria-labelledby="title"><title id="title">应用、LVGL、区域刷新和 SPI 屏幕驱动的完整调用关系</title><rect width="700" height="510" fill="#fffefb"/><rect x="25" y="20" width="650" height="67" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="47" font-size="20" font-weight="bold">main → app_init</text><text x="350" y="71" font-size="17">lv_init → lv_port_disp_init → 创建界面</text></g><path d="M350 91 v16 m-5 -5 l5 5 5 -5" stroke="#64877d" stroke-width="2" fill="none"/><rect x="25" y="113" width="650" height="67" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="140" font-size="20" font-weight="bold">Sensor_Task → app_tick</text><text x="350" y="164" font-size="17">推进 LVGL 时间，并调用 lv_timer_handler</text></g><path d="M350 184 v16 m-5 -5 l5 5 5 -5" stroke="#64877d" stroke-width="2" fill="none"/><rect x="25" y="206" width="650" height="67" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="233" font-size="20" font-weight="bold">LVGL 准备一个待刷新的矩形</text><text x="350" y="257" font-size="17">调用 disp_flush，给出 area 与 color_p</text></g><path d="M350 277 v16 m-5 -5 l5 5 5 -5" stroke="#64877d" stroke-width="2" fill="none"/><rect x="25" y="299" width="650" height="67" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="326" font-size="20" font-weight="bold">GC9A01_DrawBitmap</text><text x="350" y="350" font-size="17">SetWindow → WritePixels → HAL_SPI_Transmit</text></g><path d="M350 370 v16 m-5 -5 l5 5 5 -5" stroke="#64877d" stroke-width="2" fill="none"/><rect x="25" y="392" width="650" height="67" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="419" font-size="20" font-weight="bold">这块像素发送返回</text><text x="350" y="443" font-size="17">lv_disp_flush_ready：缓冲可交还 LVGL</text></g></svg>