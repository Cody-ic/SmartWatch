<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" role="img" aria-labelledby="title desc"><title id="title">先选择有效应用，再进入它的启动入口</title><desc id="desc">具体跳转还涉及 Cortex-M33、安全状态、中断及外设条件，不能仅调用一个普通 C 函数地址。</desc><rect width="900" height="511" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">先选择有效应用，再进入它的启动入口</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">芯片复位与最初启动路径</text><text x="52" y="124" font-size="19">按实际芯片配置取得初始入口</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">启动加载程序</text><text x="52" y="228" font-size="19">检查状态和候选镜像，决定启动哪个有效应用</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">应用启动代码</text><text x="52" y="332" font-size="19">建立应用自己的向量、栈与运行环境</text><path d="M450 353v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="377" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="407" font-size="22" font-weight="700">应用 main</text><text x="52" y="436" font-size="19">初始化外设，再启动业务或调度器</text></g></svg>