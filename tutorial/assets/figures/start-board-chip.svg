<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 388" role="img" aria-labelledby="title"><title id="title">开发板包含单片机和周边电路</title><rect width="600" height="388" fill="#fffefb"/><rect x="35" y="24" width="530" height="78" rx="10" fill="#e6f2eb" stroke="#9dbbad"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" text-anchor="middle"><text x="300" y="54" font-size="21" font-weight="bold">开发板</text><text x="300" y="83" font-size="17">一块方便供电、连接和实验的电路板</text></g><path d="M300 106 v23 m-6 -6 l6 6 6 -6" fill="none" stroke="#527b6d" stroke-width="3"/><rect x="35" y="136" width="530" height="78" rx="10" fill="#edf1f8" stroke="#9dbbad"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" text-anchor="middle"><text x="300" y="166" font-size="21" font-weight="bold">板上的单片机</text><text x="300" y="195" font-size="17">在这里执行程序、保存数据</text></g><path d="M300 218 v23 m-6 -6 l6 6 6 -6" fill="none" stroke="#527b6d" stroke-width="3"/><rect x="35" y="248" width="530" height="78" rx="10" fill="#e6f2eb" stroke="#9dbbad"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" text-anchor="middle"><text x="300" y="278" font-size="21" font-weight="bold">板上的外部电路</text><text x="300" y="307" font-size="17">例如 LED、按钮和连接插针</text></g></svg>