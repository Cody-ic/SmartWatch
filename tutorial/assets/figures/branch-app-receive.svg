<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 407" role="img" aria-labelledby="title desc"><title id="title">从通知字节到页面数值</title><desc id="desc">通信、解析和展示的分工来自实际需要，不额外建立一套教学框架。</desc><rect width="900" height="407" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">从通知字节到页面数值</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">ble_service.dart</text><text x="52" y="124" font-size="19">订阅通知、积累字节、找到完整有效帧</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">ble_protocol.dart</text><text x="52" y="228" font-size="19">按消息类型解析载荷，得到 BatteryData</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">onBattery → 页面订阅</text><text x="52" y="332" font-size="19">收到 mv 与 pct，修改 State 后更新显示</text></g></svg>