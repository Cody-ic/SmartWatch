<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 407" role="img" aria-labelledby="title desc"><title id="title">先恢复帧，再解释帧</title><desc id="desc">蓝牙包边界和应用消息边界不必相同。</desc><rect width="900" height="407" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">先恢复帧，再解释帧</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">通知一：AA 06 03</text><text x="52" y="124" font-size="19">保留未完成字节，不立即显示电压</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">通知二：A0 0F 3C 62</text><text x="52" y="228" font-size="19">已有七字节，检查长度和校验</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">得到有效电量数据</text><text x="52" y="332" font-size="19">解析电压与百分比，再交给页面</text></g></svg>