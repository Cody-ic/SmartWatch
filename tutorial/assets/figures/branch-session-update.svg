<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" role="img" aria-labelledby="title desc"><title id="title">会话结束后再提交类别中心</title><desc id="desc">计数表示有效推理窗口，采集时长受填窗、推理频率与筛选比例影响。</desc><rect width="900" height="511" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">会话结束后再提交类别中心</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">开始</text><text x="52" y="124" font-size="19">清除本次和向量与数量，记录目标类别</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">每次新特征</text><text x="52" y="228" font-size="19">通过筛选后累加，尚不修改正在使用的原型</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">结束</text><text x="52" y="332" font-size="19">至少 50 份有效特征才求均值并归一化</text><path d="M450 353v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="377" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="407" font-size="22" font-weight="700">提交</text><text x="52" y="436" font-size="19">替换目标类，更新版本与数量；取消则不提交</text></g></svg>