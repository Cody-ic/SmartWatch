<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280"><rect width="900" height="280" fill="#fffefb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64877d"/></marker></defs><rect x="20" y="40" width="265" height="100" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="35" y="73" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">EXTI0_IRQHandler</text><text x="35" y="102" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">CPU 响应后进入这里</text><path d="M290 90 L315 90" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="320" y="40" width="275" height="100" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="335" y="73" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">HAL_GPIO_EXTI_IRQHandler</text><text x="335" y="102" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">检查并清除对应事件标志</text><path d="M600 90 L625 90" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="630" y="40" width="250" height="100" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="645" y="73" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">下降沿回调</text><text x="645" y="102" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">应用在这里填写处理</text><path d="M755 155 V195 H150 V155" fill="none" stroke="#64877d" stroke-width="2" marker-end="url(#a)"/><text x="240" y="230" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#183d37">回调返回 HAL → HAL 返回入口 → 异常返回 → 原流程继续</text></svg>