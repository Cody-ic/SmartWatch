<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 388" role="img" aria-labelledby="title"><title id="title">变量数值与引脚电平需要通过硬件操作联系起来</title><rect width="600" height="388" fill="#fffefb"/><rect x="35" y="24" width="530" height="78" rx="10" fill="#e6f2eb" stroke="#9dbbad"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" text-anchor="middle"><text x="300" y="54" font-size="21" font-weight="bold">C 变量保存数值 1</text><text x="300" y="83" font-size="17">只是改变程序中的一个数据</text></g><path d="M300 106 v23 m-6 -6 l6 6 6 -6" fill="none" stroke="#527b6d" stroke-width="3"/><rect x="35" y="136" width="530" height="78" rx="10" fill="#edf1f8" stroke="#9dbbad"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" text-anchor="middle"><text x="300" y="166" font-size="21" font-weight="bold">调用操作引脚的库函数</text><text x="300" y="195" font-size="17">告诉芯片：选择哪个引脚、执行什么动作</text></g><path d="M300 218 v23 m-6 -6 l6 6 6 -6" fill="none" stroke="#527b6d" stroke-width="3"/><rect x="35" y="248" width="530" height="78" rx="10" fill="#e6f2eb" stroke="#9dbbad"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" text-anchor="middle"><text x="300" y="278" font-size="21" font-weight="bold">已配置的引脚输出高电平</text><text x="300" y="307" font-size="17">外部电路才可能因此发生变化</text></g></svg>