<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 407" role="img" aria-labelledby="title desc"><title id="title">固定特征提取，调整类别代表点</title><desc id="desc">特征提取器改变以后，旧原型通常不能未经验证继续复用。</desc><rect width="900" height="407" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">固定特征提取，调整类别代表点</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">六轴时间窗口</text><text x="52" y="124" font-size="19">与基础模型相同的采样、单位和预处理</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">特征提取网络</text><text x="52" y="228" font-size="19">把一段动作变成 128 个描述数值</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">比较各类原型</text><text x="52" y="332" font-size="19">选择与新特征相似的类别，并记录分数</text></g></svg>