<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" role="img" aria-labelledby="t"><title id="t">同一个采样时刻，两根数据线各传递一个方向的数据</title><rect width="680" height="334" fill="#fffefb"/><rect x="25" y="22" width="630" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="49" font-size="20" font-weight="bold">主机 → MOSI → 从机</text><text x="340" y="74" font-size="17">主机准备 0xA6，从机按八个采样点组成字节</text></g><path d="M340 93 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="116" width="630" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="143" font-size="20" font-weight="bold">从机 → MISO → 主机</text><text x="340" y="168" font-size="17">本模型从机预先准备 0x3C，主机同时采样</text></g><path d="M340 187 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="210" width="630" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="237" font-size="20" font-weight="bold">八个周期，两端各交换一个字节</text><text x="340" y="262" font-size="17">业务含义另行约定，不默认返回数据就是回显</text></g></svg>