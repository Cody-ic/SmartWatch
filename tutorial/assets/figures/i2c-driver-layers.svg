<svg xmlns="http://www.w3.org/2000/svg" width="960" height="305" viewBox="0 0 960 305" role="img" aria-label="把能收发字节，组织成应用可以使用的驱动"><rect width="960" height="305" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif"><text x="28" y="37" font-size="23" fill="#182a30" text-anchor="start">把能收发字节，组织成应用可以使用的驱动</text><rect x="30" y="100" width="270" height="110" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="165" y="143" font-size="24" fill="#182a30" text-anchor="middle">总线层</text><text x="165" y="181" font-size="17" fill="#182a30" text-anchor="middle">HAL / GPIO 搬运字节</text><path d="M300 155 L345 155" fill="none" stroke="#779b8f" stroke-width="3"/><rect x="345" y="100" width="270" height="110" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="480" y="143" font-size="24" fill="#182a30" text-anchor="middle">器件层</text><text x="480" y="181" font-size="17" fill="#182a30" text-anchor="middle">命令、寄存器与数据含义</text><path d="M615 155 L660 155" fill="none" stroke="#779b8f" stroke-width="3"/><rect x="660" y="100" width="270" height="110" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="795" y="143" font-size="24" fill="#182a30" text-anchor="middle">应用层</text><text x="795" y="181" font-size="17" fill="#182a30" text-anchor="middle">串口输出、UI 与业务</text><text x="40" y="265" font-size="21" fill="#182a30" text-anchor="start">换器件 → 重读它的手册，重写器件语义；不是只改一个设备地址。</text></g></svg>