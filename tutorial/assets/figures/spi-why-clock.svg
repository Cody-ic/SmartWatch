<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" role="img" aria-labelledby="t"><title id="t">从各自计时的问题引出共享时钟</title><rect width="680" height="334" fill="#fffefb"/><rect x="25" y="22" width="630" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="49" font-size="20" font-weight="bold">原来的办法：两端分别推算时间</text><text x="340" y="74" font-size="17">发送端保持数据，接收端按自己的时间读取</text></g><path d="M340 93 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="116" width="630" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="143" font-size="20" font-weight="bold">遇到的问题：实际位时间可能不同</text><text x="340" y="168" font-size="17">读取位置可能在一帧内逐渐偏移</text></g><path d="M340 187 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="210" width="630" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="237" font-size="20" font-weight="bold">换一种办法：双方依据同一个节拍</text><text x="340" y="262" font-size="17">共用时钟线，按约定边沿协调收发</text></g></svg>