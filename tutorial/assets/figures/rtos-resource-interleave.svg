<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" role="img" aria-labelledby="title desc"><title id="title">一次交错，丢掉一次加一</title><desc id="desc">这说明操作需要统一安排；volatile 本身不能提供互斥。</desc><rect width="900" height="425" rx="14" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif" fill="#18383e"><text x="35" y="43" font-size="24" font-weight="700">一次交错，丢掉一次加一</text><rect x="35" y="68" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="98" font-size="21" font-weight="700">任务 A：读到 total = 10</text><text x="58" y="127" font-size="18">准备计算，但尚未写回时切换到任务 B</text><path d="M450 148v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="173" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="203" font-size="21" font-weight="700">任务 B：读到 10，计算并写回 11</text><text x="58" y="232" font-size="18">任务 B 完成一次加一，随后切回 A</text><path d="M450 253v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="278" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="308" font-size="21" font-weight="700">任务 A：把自己先前算出的 11 写回</text><text x="58" y="337" font-size="18">两次加一的最终结果仍是 11</text></g></svg>