<svg xmlns="http://www.w3.org/2000/svg" width="960" height="325" viewBox="0 0 960 325" role="img" aria-label="先把接收数组与手册中的输出位置一一对应"><rect width="960" height="325" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif"><text x="28" y="37" font-size="23" fill="#182a30" text-anchor="start">先把接收数组与手册中的输出位置一一对应</text><rect x="25" y="85" width="120" height="120" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="85" y="119" font-size="23" fill="#182a30" text-anchor="middle">AX</text><text x="57" y="160" font-size="23" fill="#182a30" text-anchor="middle">H</text><text x="113" y="160" font-size="23" fill="#182a30" text-anchor="middle">L</text><text x="85" y="188" font-size="16" fill="#182a30" text-anchor="middle">[0] [1]</text><rect x="157" y="85" width="120" height="120" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="217" y="119" font-size="23" fill="#182a30" text-anchor="middle">AY</text><text x="189" y="160" font-size="23" fill="#182a30" text-anchor="middle">H</text><text x="245" y="160" font-size="23" fill="#182a30" text-anchor="middle">L</text><text x="217" y="188" font-size="16" fill="#182a30" text-anchor="middle">[2] [3]</text><rect x="289" y="85" width="120" height="120" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="349" y="119" font-size="23" fill="#182a30" text-anchor="middle">AZ</text><text x="321" y="160" font-size="23" fill="#182a30" text-anchor="middle">H</text><text x="377" y="160" font-size="23" fill="#182a30" text-anchor="middle">L</text><text x="349" y="188" font-size="16" fill="#182a30" text-anchor="middle">[4] [5]</text><rect x="421" y="85" width="120" height="120" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="481" y="119" font-size="23" fill="#182a30" text-anchor="middle">温度</text><text x="453" y="160" font-size="23" fill="#182a30" text-anchor="middle">H</text><text x="509" y="160" font-size="23" fill="#182a30" text-anchor="middle">L</text><text x="481" y="188" font-size="16" fill="#182a30" text-anchor="middle">[6] [7]</text><rect x="553" y="85" width="120" height="120" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="613" y="119" font-size="23" fill="#182a30" text-anchor="middle">GX</text><text x="585" y="160" font-size="23" fill="#182a30" text-anchor="middle">H</text><text x="641" y="160" font-size="23" fill="#182a30" text-anchor="middle">L</text><text x="613" y="188" font-size="16" fill="#182a30" text-anchor="middle">[8] [9]</text><rect x="685" y="85" width="120" height="120" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="745" y="119" font-size="23" fill="#182a30" text-anchor="middle">GY</text><text x="717" y="160" font-size="23" fill="#182a30" text-anchor="middle">H</text><text x="773" y="160" font-size="23" fill="#182a30" text-anchor="middle">L</text><text x="745" y="188" font-size="16" fill="#182a30" text-anchor="middle">[10] [11]</text><rect x="817" y="85" width="120" height="120" rx="8" fill="#e6f2eb" stroke="#a5bdb5"/><text x="877" y="119" font-size="23" fill="#182a30" text-anchor="middle">GZ</text><text x="849" y="160" font-size="23" fill="#182a30" text-anchor="middle">H</text><text x="905" y="160" font-size="23" fill="#182a30" text-anchor="middle">L</text><text x="877" y="188" font-size="16" fill="#182a30" text-anchor="middle">[12] [13]</text><text x="30" y="253" font-size="20" fill="#182a30" text-anchor="start">从 3B 开始一次读取 14 字节；每项先高字节 H，再低字节 L。</text><text x="30" y="292" font-size="19" fill="#182a30" text-anchor="start">先还原 16 位补码，再按当前量程换算；不能漏掉中间的温度。</text></g></svg>