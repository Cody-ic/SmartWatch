<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280"><rect width="900" height="280" fill="#fffefb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64877d"/></marker></defs><rect x="20" y="50" width="215" height="100" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="35" y="83" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">串口接收中断</text><text x="35" y="112" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">收到本次要求的 1 字节</text><path d="M240 100 L295 100" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="300" y="50" width="275" height="100" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="315" y="83" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">应用回调</text><text x="315" y="112" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">存入单字节收件箱，再挂接</text><path d="M580 100 L635 100" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="640" y="50" width="240" height="100" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="655" y="83" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">主循环</text><text x="655" y="112" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">取出字节，处理并回显</text><text x="65" y="230" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">收件箱满时记录丢弃，不在 ISR 中等待；短暂保护只包住“取出并清空”。</text></svg>