<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 421" role="img" aria-label="从顺序刷新到可能的重叠流水"><rect width="700" height="421" fill="#fffefb"/><rect x="25" y="20" width="650" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="48" font-size="20" font-weight="bold">轮询：绘制 → 发送 → 完成</text><text x="350" y="72" font-size="17">同一缓冲在发送结束前不能复用</text></g><path d="M350 91 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="114" width="650" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="142" font-size="20" font-weight="bold">DMA：启动后仍占用当前数据</text><text x="350" y="166" font-size="17">CPU 可以做别的事，数据不能失效</text></g><path d="M350 185 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="208" width="650" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="236" font-size="20" font-weight="bold">双缓冲：另一块供绘图</text><text x="350" y="260" font-size="17">配合异步端口才可能重叠</text></g><path d="M350 279 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="302" width="650" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="330" font-size="20" font-weight="bold">真实完成后归还</text><text x="350" y="354" font-size="17">更快的目标不改变正确性要求</text></g></svg>