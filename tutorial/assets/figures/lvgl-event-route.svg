<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 421" role="img" aria-label="从操作到界面变化的事件链"><rect width="700" height="421" fill="#fffefb"/><rect x="25" y="20" width="650" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="48" font-size="20" font-weight="bold">输入来源</text><text x="350" y="72" font-size="17">鼠标、触摸、按键或解码好的应用意图</text></g><path d="M350 91 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="114" width="650" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="142" font-size="20" font-weight="bold">对象收到事件</text><text x="350" y="166" font-size="17">例如 CLICKED 或 VALUE_CHANGED</text></g><path d="M350 185 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="208" width="650" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="236" font-size="20" font-weight="bold">已注册的回调</text><text x="350" y="260" font-size="17">改变应用状态，不做长等待</text></g><path d="M350 279 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="302" width="650" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="330" font-size="20" font-weight="bold">更新已有对象</text><text x="350" y="354" font-size="17">库重绘改变的界面部分</text></g></svg>