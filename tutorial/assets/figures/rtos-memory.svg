<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" role="img" aria-labelledby="title desc"><title id="title">任务栈也要占用真实存储空间</title><desc id="desc">此图说明容量归属，不是当前链接器实际地址图；动态任务栈位于内核分配池中。</desc><rect width="900" height="425" rx="14" fill="#fffefb"/><g font-family="Microsoft YaHei, sans-serif" fill="#18383e"><text x="35" y="43" font-size="24" font-weight="700">任务栈也要占用真实存储空间</text><rect x="35" y="68" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="98" font-size="21" font-weight="700">链接时安排：全局和静态数组</text><text x="58" y="127" font-size="18">即使没有放进任务局部变量，它们仍然占用 RAM</text><path d="M450 148v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="173" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="203" font-size="21" font-weight="700">内核动态分配池：当前配置 32768 字节</text><text x="58" y="232" font-size="18">任务栈、任务管理信息、动态队列等从这里分配</text><path d="M450 253v20m-7-7 7 7 7-7" fill="none" stroke="#497f73" stroke-width="3"/><rect x="35" y="278" width="830" height="78" rx="10" fill="#e7f2ed" stroke="#94b9ad"/><text x="58" y="308" font-size="21" font-weight="700">每个任务使用自己的栈</text><text x="58" y="337" font-size="18">调用越深、普通局部数据越多，峰值占用可能越大</text></g></svg>