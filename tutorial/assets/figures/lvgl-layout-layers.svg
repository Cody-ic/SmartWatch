<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 421" role="img" aria-label="布局需要先分清三个层次"><rect width="700" height="421" fill="#fffefb"/><rect x="25" y="20" width="650" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="48" font-size="20" font-weight="bold">容器边界</text><text x="350" y="72" font-size="17">确定可使用的整体尺寸</text></g><path d="M350 91 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="114" width="650" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="142" font-size="20" font-weight="bold">内边距与内容区域</text><text x="350" y="166" font-size="17">把内容与边框分开</text></g><path d="M350 185 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="208" width="650" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="236" font-size="20" font-weight="bold">子对象排列</text><text x="350" y="260" font-size="17">决定横排、竖排以及对象间隔</text></g><path d="M350 279 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="302" width="650" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><text x="350" y="330" font-size="20" font-weight="bold">样式与资源</text><text x="350" y="354" font-size="17">字体、颜色、图像改变最终尺寸与外观</text></g></svg>