<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280"><rect width="900" height="280" fill="#fffefb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64877d"/></marker></defs><rect x="20" y="55" width="200" height="95" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="35" y="88" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">TIM6 定期到时</text><text x="35" y="117" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">产生更新中断请求</text><path d="M225 100 L255 100" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="260" y="55" width="245" height="95" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="275" y="88" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">TIM6_IRQHandler</text><text x="275" y="117" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">调用 HAL_TIM_IRQHandler</text><path d="M510 100 L540 100" stroke="#64877d" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="545" y="55" width="335" height="95" rx="11" fill="#e6f2eb" stroke="#89a89b" stroke-width="2"/><text x="560" y="88" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">定时器回调</text><text x="560" y="117" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#183d37">确认 TIM6，调用 HAL_IncTick</text><text x="100" y="230" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#183d37">HAL_GetTick 读取计数；HAL_Delay 根据计数差检查是否已经等够时间。</text></svg>