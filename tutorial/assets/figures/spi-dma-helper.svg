<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 428" role="img" aria-labelledby="t"><title id="t">DMA 负责内存与外设之间的数据搬运，SPI 负责线上移位</title><rect width="680" height="428" fill="#fffefb"/><rect x="25" y="22" width="630" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="49" font-size="20" font-weight="bold">CPU 先安排任务</text><text x="340" y="74" font-size="17">指定数据位置、方向、数量并启动</text></g><path d="M340 93 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="116" width="630" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="143" font-size="20" font-weight="bold">DMA 小助手搬数据</text><text x="340" y="168" font-size="17">按 SPI 请求把内存中的数据送进外设</text></g><path d="M340 187 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="210" width="630" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="237" font-size="20" font-weight="bold">SPI 硬件产生线上传输</text><text x="340" y="262" font-size="17">按配置的时钟，把字节逐位送出去</text></g><path d="M340 281 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="304" width="630" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="331" font-size="20" font-weight="bold">完成路径通知应用</text><text x="340" y="356" font-size="17">确认本次 SPI 事务完成，再处理下一笔</text></g></svg>