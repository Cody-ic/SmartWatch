<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-label="OLED 画面先在 MCU 内存中修改，再通过 SPI 刷新到屏幕"><rect width="700" height="350" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37"><rect x="30" y="25" width="640" height="80" rx="10" fill="#e6f2eb" stroke="#a8bfb6"/><text x="350" y="57" text-anchor="middle" font-size="21">单片机 RAM 中的画布：1024 字节</text><text x="350" y="87" text-anchor="middle" font-size="17">清空、点像素、画图案，先只改变这份数据</text><path d="M350 112 v35 m-6 -6 l6 6 6 -6" stroke="#64877d" fill="none" stroke-width="3"/><text x="370" y="137" font-size="17">Flush：通过 SPI 发送</text><rect x="30" y="160" width="640" height="80" rx="10" fill="#e9eef8" stroke="#a8bfb6"/><text x="350" y="192" text-anchor="middle" font-size="21">OLED 控制器中的显示存储区</text><text x="350" y="222" text-anchor="middle" font-size="17">接到命令选定位置，再把像素字节写进去</text><text x="350" y="292" text-anchor="middle" font-size="19">改画布 ≠ 屏幕已更新；刷新完成后才看到变化</text></g></svg>