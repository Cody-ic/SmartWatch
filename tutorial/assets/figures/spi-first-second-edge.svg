<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-label="时钟空闲低时第一边沿上升，空闲高时第一边沿下降"><rect width="800" height="310" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" font-size="18"><text x="25" y="38">每个周期：先离开空闲电平，再回到空闲电平</text><text x="25" y="112">空闲低</text><text x="25" y="232">空闲高</text><text x="217" y="70">第一：上升</text><text x="486" y="70">第二：下降</text><text x="217" y="190">第一：下降</text><text x="486" y="190">第二：上升</text></g><g fill="none" stroke="#007b68" stroke-width="3"><path d="M130 130 H270 V90 H540 V130 H745"/><path d="M130 210 H270 V250 H540 V210 H745"/></g><g fill="#607075" font-family="Microsoft YaHei,sans-serif" font-size="16"><text x="140" y="158">低 → 高 → 低</text><text x="140" y="284">高 → 低 → 高</text></g></svg>