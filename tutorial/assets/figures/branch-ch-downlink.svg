<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" role="img" aria-labelledby="title desc"><title id="title">一次手机写入，经过哪些位置</title><desc id="desc">每一步都明确字节当前存在哪里；桥接过程不修改业务内容。</desc><rect width="900" height="511" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">一次手机写入，经过哪些位置</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">手机写 FFE2</text><text x="52" y="124" font-size="19">写入一段字节；一段不一定是一条完整应用消息</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">ble_uart_WriteAttrCB</text><text x="52" y="228" font-size="19">库已定位到写入特征，传入数据指针与长度</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">on_bleuartServiceEvt → app_uart_tx_data</text><text x="52" y="332" font-size="19">复制到 CH 串口发送软件队列</text><path d="M450 353v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="377" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="407" font-size="22" font-weight="700">app_uart_process → UART1</text><text x="52" y="436" font-size="19">分批写发送寄存器，STM32 接收后组装应用帧</text></g></svg>