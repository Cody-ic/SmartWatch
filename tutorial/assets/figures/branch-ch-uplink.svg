<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" role="img" aria-labelledby="title desc"><title id="title">从串口接收走向蓝牙通知</title><desc id="desc">通知中的一次数据块由传输条件决定，不等于一条业务帧。</desc><rect width="900" height="511" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">从串口接收走向蓝牙通知</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">UART1 中断</text><text x="52" y="124" font-size="19">收到 STM32 字节，保存到 4096 字节软件队列</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">UART_TO_BLE_SEND_EVT</text><text x="52" y="228" font-size="19">检查连接与通知订阅，再决定本次取多少字节</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">to_test_buffer → 协议库发送缓冲</text><text x="52" y="332" font-size="19">保留本批内容；提交 FFE3 通知，资源忙时稍后重试</text><path d="M450 353v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="377" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="407" font-size="22" font-weight="700">手机通知回调</text><text x="52" y="436" font-size="19">收到字节片段，交给持续运行的应用帧解析器</text></g></svg>