<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 428" role="img" aria-labelledby="t"><title id="t">从初始化屏幕到设置区域并发送像素</title><rect width="680" height="428" fill="#fffefb"/><rect x="25" y="22" width="630" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="49" font-size="20" font-weight="bold">复位与初始化</text><text x="340" y="74" font-size="17">先让控制器进入能够正常接收显示操作的状态</text></g><path d="M340 93 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="116" width="630" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="143" font-size="20" font-weight="bold">D/C 低：发送命令</text><text x="340" y="168" font-size="17">告诉屏幕接下来要设置区域或写显示数据</text></g><path d="M340 187 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="210" width="630" height="68" rx="9" fill="#e6f2eb" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="237" font-size="20" font-weight="bold">D/C 高：发送参数与像素</text><text x="340" y="262" font-size="17">坐标和颜色按控制器规定的格式组织</text></g><path d="M340 281 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#64877d" stroke-width="2"/><rect x="25" y="304" width="630" height="68" rx="9" fill="#e9eef8" stroke="#a8bfb6"/><g fill="#183d37" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="340" y="331" font-size="20" font-weight="bold">保持事务要求，传完后再结束</text><text x="340" y="356" font-size="17">CS 与 D/C 不在异步数据仍发送时提前改变</text></g></svg>