<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 407" role="img" aria-labelledby="title desc"><title id="title">先分记录，再从各自记录切窗口</title><desc id="desc">相邻且高度重叠的窗口不能分到不同集合假装独立。</desc><rect width="900" height="407" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">先分记录，再从各自记录切窗口</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">训练人员与记录</text><text x="52" y="124" font-size="19">用于调整权重，估计归一化参数</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">验证人员与记录</text><text x="52" y="228" font-size="19">用于选择轮数、结构和其他配置</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">独立测试人员与记录</text><text x="52" y="332" font-size="19">配置确定后，检查未参与选择的数据表现</text></g></svg>