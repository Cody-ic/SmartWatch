<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="title"><title id="title">从 C 源码到单片机运行的四步</title><rect width="600" height="500" fill="#fffefb"/><rect x="35" y="24" width="530" height="78" rx="10" fill="#e6f2eb" stroke="#9dbbad"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" text-anchor="middle"><text x="300" y="54" font-size="21" font-weight="bold">写代码</text><text x="300" y="83" font-size="17">在电脑中编辑 C 源文件</text></g><path d="M300 106 v23 m-6 -6 l6 6 6 -6" fill="none" stroke="#527b6d" stroke-width="3"/><rect x="35" y="136" width="530" height="78" rx="10" fill="#edf1f8" stroke="#9dbbad"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" text-anchor="middle"><text x="300" y="166" font-size="21" font-weight="bold">构建程序</text><text x="300" y="195" font-size="17">编译和链接，得到目标芯片使用的程序文件</text></g><path d="M300 218 v23 m-6 -6 l6 6 6 -6" fill="none" stroke="#527b6d" stroke-width="3"/><rect x="35" y="248" width="530" height="78" rx="10" fill="#e6f2eb" stroke="#9dbbad"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" text-anchor="middle"><text x="300" y="278" font-size="21" font-weight="bold">烧录程序</text><text x="300" y="307" font-size="17">通过支持的连接方式写入芯片</text></g><path d="M300 330 v23 m-6 -6 l6 6 6 -6" fill="none" stroke="#527b6d" stroke-width="3"/><rect x="35" y="360" width="530" height="78" rx="10" fill="#edf1f8" stroke="#9dbbad"/><g font-family="Microsoft YaHei,sans-serif" fill="#183d37" text-anchor="middle"><text x="300" y="390" font-size="21" font-weight="bold">运行并观察</text><text x="300" y="419" font-size="17">芯片执行程序，再检查灯或其他输出</text></g></svg>