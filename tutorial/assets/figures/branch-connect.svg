<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" role="img" aria-labelledby="title desc"><title id="title">从发现设备到收到应用数据</title><desc id="desc">连接已建立与已能交换完整消息是不同阶段。</desc><rect width="900" height="511" rx="12" fill="#fffefb"/><g font-family="Microsoft YaHei,sans-serif" fill="#18383e"><text x="32" y="42" font-size="24" font-weight="700">从发现设备到收到应用数据</text><rect x="32" y="65" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="95" font-size="22" font-weight="700">扫描并选择设备</text><text x="52" y="124" font-size="19">得到设备对象，确认名称、服务与信号</text><path d="M450 145v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="169" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="199" font-size="22" font-weight="700">建立连接并发现服务</text><text x="52" y="228" font-size="19">找到 FFE0 服务及 FFE2、FFE3 特征</text><path d="M450 249v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="273" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="303" font-size="22" font-weight="700">订阅通知</text><text x="52" y="332" font-size="19">启用 FFE3 通知并登记收到字节时的回调</text><path d="M450 353v18m-7-7 7 7 7-7" stroke="#397365" stroke-width="3" fill="none"/><rect x="32" y="377" width="836" height="78" rx="9" fill="#e7f2ed" stroke="#9ab9ad"/><text x="52" y="407" font-size="22" font-weight="700">恢复应用消息</text><text x="52" y="436" font-size="19">把字节送入接收缓冲，解析有效帧</text></g></svg>